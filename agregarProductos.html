<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Vendedor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./CSS/agregarProductos.css">
</head>
<body>


<div id="navbar-container"></div>

<div class="container py-5">

    <!-- TITULO PRINCIPAL -->
    <div class="mb-5">
        <h1 class="titulo-principal">Panel del vendedor</h1>
        <p class="subtitulo-principal">Gestiona tus productos y visualiza tu inventario</p>
    </div>

    <!-- AGREGAR PRODUCTO -->
    <div class="mb-4">
        <h3 class="fw-bold">Agregar producto</h3>
    </div>

    <!-- TARJETA FORMULARIO -->
    <div class="card card-form p-4">
        <div class="card-body">

            <!-- Información básica -->
            <div class="d-flex align-items-center mb-4">
                <i class="bi bi-box"></i>
                <h5  class="seccion-titulo mb-0">Información básica</h5>
            </div>

            <h6 class="mb-4 text-muted">Detalles principales del producto</h6>

            <form>

                <!-- Nombre y Categoría -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">
                            Nombre del producto <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" placeholder="Ej. Playera deportiva">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Categoría <span class="required">*</span>
                        </label>
                        <select class="form-select">
                            <option selected disabled>Selecciona una categoría</option>
                            <option>Hombre</option>
                            <option>Mujer</option>
                            <option>Unisex</option>
                        </select>
                    </div>
                </div>

                <!-- Descripción -->
                <div class="mb-3">
                    <label class="form-label">
                        Descripción <span class="required">*</span>
                    </label>
                    <textarea class="form-control" rows="3" placeholder="Describe el producto..."></textarea>
                </div>

                <!-- Material y Precio -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">
                            Material <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" placeholder="Ej. Algodón">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Precio <span class="required">*</span>
                        </label>
                        <input type="number" class="form-control" placeholder="$0.00">
                    </div>
                </div>

                <!-- Stock -->
                <div class="mb-3">
                    <label class="form-label">
                        Stock disponible <span class="required">*</span>
                    </label>
                        <input type="number" class="form-control" placeholder="Cantidad disponible">
                </div>

                <!-- Etiqueta -->
                <div class="mb-3">
                    <label class="form-label">
                        Etiqueta del producto
                    </label>
                    <input type="text" class="form-control" placeholder="Ej. Nuevo, Oferta, Edición limitada">
                </div>

            </form>

        </div>
    </div>

</div>

  <div id="footer"></div>
<script src="./javascript/main.js"></script>
<link rel="stylesheet" href="./CSS/main.css">
</body>
</html>
