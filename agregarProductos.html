<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Vendedor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./CSS/agregarProductos.css">
</head>
<body>

<div id="navbar-container"></div>

<div class="container py-5">

    <!-- TITULO PRINCIPAL -->
    <div class="mb-5">
        <h1 class="titulo-principal">Panel del vendedor</h1>
        <p class="subtitulo-principal">Gestiona tus productos y visualiza tu inventario</p>
    </div>

    <!-- AGREGAR PRODUCTO -->
    <div class="mb-4">
        <h3 class="fw-bold">Agregar producto</h3>
    </div>

    <!-- TARJETA FORMULARIO -->
    <div class="card card-form p-4">
        <div class="card-body">

            <!-- Información básica -->
            <div class="d-flex align-items-center mb-4">
                <i class="bi bi-box"></i>
                <h5  class="seccion-titulo mb-0"> Información básica</h5>
            </div>

            <h6 class="mb-4 text-muted">Detalles principales del producto</h6>

            <form>

                <!-- Nombre y Categoría -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">
                            Nombre del producto <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" placeholder="Ej. Playera deportiva">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Categoría <span class="required">*</span>
                        </label>
                        <select class="form-select">
                            <option selected disabled>Selecciona una categoría</option>
                            <option>Hombre</option>
                            <option>Mujer</option>
                            <option>Unisex</option>
                        </select>
                    </div>
                </div>

                <!-- Descripción -->
                <div class="mb-3">
                    <label class="form-label">
                        Descripción <span class="required">*</span>
                    </label>
                    <textarea class="form-control" rows="3" placeholder="Describe el producto..."></textarea>
                </div>

                <!-- Material y Precio -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">
                            Material <span class="required">*</span>
                        </label>
                        <input type="text" class="form-control" placeholder="Ej. Algodón">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">
                            Precio <span class="required">*</span>
                        </label>
                        <input type="number" class="form-control" placeholder="$0.00">
                    </div>
                </div>

                <!-- Stock -->
                <div class="mb-3">
                    <label class="form-label">
                        Stock disponible <span class="required">*</span>
                    </label>
                        <input type="number" class="form-control" placeholder="Cantidad disponible">
                </div>

                <!-- Etiqueta -->
                <div class="mb-3">
                    <label class="form-label">
                        Etiqueta del producto
                    </label>
                    <input type="text" class="form-control" placeholder="Ej. Nuevo, Oferta, Edición limitada">
                </div>

            </form>

        </div>
    </div>

<!--Tallas/Tamaños-->
<div class="container py-5">

  <!-- CARD PRINCIPAL -->
  <div class="card shadow-sm p-4 mb-4">
    <h5 class="mb-3">Tallas / Tamaños</h5>
    <p class="text-muted small">Selecciona las tallas disponibles o agrega tallas personalizadas</p>

    <!-- Tallas de ropa -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Tallas de Ropa</label>
      <div class="d-flex flex-wrap gap-2">
        <input type="checkbox" class="btn-check" id="xs" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="xs">XS</label>

        <input type="checkbox" class="btn-check" id="s" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="s">S</label>

        <input type="checkbox" class="btn-check" id="m" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="m">M</label>

        <input type="checkbox" class="btn-check" id="l" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="l">L</label>

        <input type="checkbox" class="btn-check" id="xl" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="xl">XL</label>

        <input type="checkbox" class="btn-check" id="xxl" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="xxl">XXL</label>
      </div>
    </div>

    <!-- Tallas de calzado -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Tallas de Calzado</label>
      <div class="d-flex flex-wrap gap-2">
        <input type="checkbox" class="btn-check" id="35" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="35">35</label>

        <input type="checkbox" class="btn-check" id="36" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="36">36</label>

        <input type="checkbox" class="btn-check" id="37" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="37">37</label>

        <input type="checkbox" class="btn-check" id="38" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="38">38</label>

        <input type="checkbox" class="btn-check" id="39" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="39">39</label>
      </div>
    </div>

    <!-- Tallas numéricas -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Tallas Numéricas (Pantalones)</label>
      <div class="d-flex flex-wrap gap-2">
        <input type="checkbox" class="btn-check" id="28" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="28">28</label>

        <input type="checkbox" class="btn-check" id="30" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="30">30</label>

        <input type="checkbox" class="btn-check" id="32" autocomplete="off">
        <label class="btn btn-outline-secondary btn-sm rounded-pill" for="32">32</label>
      </div>
    </div>

    <!-- Talla personalizada -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Talla Personalizada</label>
      <div class="input-group">
        <input type="text" class="form-control" placeholder="Ej: Único, 2XL, etc.">
        <button class="btn btn-outline-secondary" type="button">+</button> <!--aca hay que crear un desplegable personalizado-->
      </div>
    </div>

  </div>

  <!-- IMAGEN DEL PRODUCTO -->
  <div class="card shadow-sm p-4">
    <h5 class="mb-3">Imagen del Producto</h5>
    <p class="text-muted small">Sube una imagen o proporciona una URL</p>

    <div class="mb-3">
      <label class="form-label fw-semibold">URL de la Imagen</label>
      <input type="text" class="form-control" placeholder="https://ejemplo.com/imagen.jpg">
    </div>

    <!-- Separador -->
    <div class="d-flex align-items-center my-3">
      <hr class="flex-grow-1">
      <span class="mx-2 text-muted small">o</span>
      <hr class="flex-grow-1">
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Subir Archivo</label>
      <input type="file" class="form-control">
    </div>

    <!-- Botones finales --> <!--aqui hay que ligar con js-->
    <div class="d-flex justify-content-end gap-2 mt-4">
      <button class="btn btn-outline-secondary">Limpiar Formulario</button>
      <button class="btn btn-dark">Agregar Producto</button>
    </div>

    </div>
</div>
</div>

  <div id="footer"></div>
<script src="./javascript/main.js"></script>
<link rel="stylesheet" href="./CSS/main.css">
</body>
</html>
