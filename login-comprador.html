<!doctype html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hilo Nacional | Iniciar sesión Comprador</title>

    <!-- Script ANTI-FLASH -->
    <script>
      const savedTheme = localStorage.getItem("theme");
      document.documentElement.style.visibility = "hidden";
      if (savedTheme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
      document.addEventListener("DOMContentLoaded", () => {
        document.documentElement.style.visibility = "visible";
        document.body.classList.add("theme-ready");
      });
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="CSS/registro-comprador.css">
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="./assets/logoFooter.svg">
  </head>

  <body>

    <div id="navbar-container"></div>

    <main class="login-wrap bg-light">
      <div class="container container-narrow">
        <div class="text-center mb-4">
          <h1 class="display-6 login-title mb-2">Bienvenido</h1>
          <p class="login-sub">Inicia sesión en tu cuenta</p>
        </div>

        <nav class="d-flex gap-2 bg-secondary-subtle rounded-pill p-1 mx-auto mb-3" style="max-width:26rem" aria-label="Tipo de registro">
          <a href="./login-comprador.html" class="flex-fill text-center py-2 px-3 rounded-pill fw-semibold text-secondary text-decoration-none d-flex align-items-center justify-content-center gap-2 bg-white shadow-sm" aria-current="page">
            <img src="assets/icono_comprador.svg" alt="Comprador" width="18" height="18"/>
            Comprador
          </a>
          <a href="./login-vendedor.html" class="flex-fill text-center py-2 px-3 rounded-pill fw-semibold text-secondary text-decoration-none d-flex align-items-center justify-content-center gap-2">
            <img src="assets/icono_vendedor.svg" alt="Vendedor" width="18" height="18"/>
            Vendedor
          </a>
        </nav>

        <div class="card shadow-sm mx-auto login-card" style="max-width:560px;">
          <div class="card-body p-4 p-md-5">
            <h5 class="fw-semibold mb-1">Iniciar Sesión como Comprador</h5>
            <p class="text-muted mb-4">Accede a tu cuenta para realizar compras</p>

            <form id="form-login" novalidate>
              <div class="mb-3">
                <label for="emailC" class="form-label">Email</label>
                <input type="email" class="form-control" id="emailC" name="email" placeholder="tu@email.com" required>
                <div class="invalid-feedback">Ingresa un correo válido.</div>
              </div>
              <div class="mb-3">
                <label for="passwordC" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="passwordC" name="password" minlength="6" placeholder="*******" required>
                <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
              </div>
              <button class="btn btn-dark w-100 rounded-3 fw-bold mt-2" type="submit">Iniciar Sesión</button>
            </form>

            <div class="text-center mt-3 login-footer">
              <p class="mt-2 text-center">¿No tienes cuenta? <a class="text-primary fw-semibold text-decoration-none" href="./registro-comprador.html">Regístrate</a></p>
            </div>
          </div>
        </div>

        <div class="text-center mt-4">
          <div class="text-center mt-3"><a class="text-secondary text-decoration-none" href="index.html">Volver al inicio</a></div>
        </div>
      </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./javascript/main.js"></script>
    <script src="./javascript/productos.js"></script>
    <script src="./javascript/login.js"></script>
  </body>
</html>
