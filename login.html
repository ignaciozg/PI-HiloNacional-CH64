<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilo Nacional | Iniciar Sesión</title>

    <script>
        const savedTheme = localStorage.getItem("theme");
        document.documentElement.style.visibility = "hidden";
        if (savedTheme === "dark") document.documentElement.setAttribute("data-theme", "dark");
        document.addEventListener("DOMContentLoaded", () => {
            document.documentElement.style.visibility = "visible";
            document.body.classList.add("theme-ready");
        });
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./CSS/main.css" />
    <link rel="stylesheet" href="./CSS/login.css" />
</head>
<body>

<div id="navbar-container"></div>

<main class="main-registro d-flex align-items-center justify-content-center">
    <div class="card-registro shadow">
        <h2 class="titulo-registro">Bienvenido de nuevo</h2>

        <form id="formulario-login" novalidate>

            <div class="mb-3">
                <label for="correo-login" class="label-registro">Correo Electrónico</label>
                <input type="email" id="correo-login" class="form-control input-registro" placeholder="ejemplo@correo.com" required>
                <span id="error-correo" class="error-text"></span>
            </div>

            <div class="mb-4">
                <label for="password-login" class="label-registro">Contraseña</label>
                <input type="password" id="password-login" class="form-control input-registro" placeholder="••••••••" required>
                <span id="error-password" class="error-text"></span>
            </div>

            <button type="submit" class="btn-crear-cuenta">Iniciar Sesión</button>
        </form>

        <div class="text-center mt-3">
            <a href="registro.html" class="link-login">¿No tienes cuenta? Crear una</a>
        </div>
    </div>
</main>

<div id="footer"></div>

<script src="./javascript/main.js"></script>
<script src="./javascript/login.js"></script>
</body>
</html>
