<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detalle del Producto | Hilo Nacional</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="./CSS/main.css" />
    <link rel="stylesheet" href="./CSS/productos.css" />
    <link rel="stylesheet" href="./CSS/detalle.css" />
  </head>
  <body>
    <div id="navbar-container"></div>

    <main class="container py-5 mt-5">
      <div class="row g-5" id="contenedor-detalle-producto">
        <div class="col-md-6 text-center">
          <img
            id="detalle-img"
            src=""
            alt="Cargando..."
            class="img-fluid rounded shadow-lg w-100"
            style="max-height: 600px; object-fit: cover"
          />
        </div>

        <div class="col-md-6">
          <span
            id="detalle-categoria"
            class="badge bg-secondary mb-2 text-uppercase letter-spacing-1"
            >Categoría</span
          >
          <h1 id="detalle-titulo" class="fw-bold mb-3 display-5">
            Cargando producto...
          </h1>
          <h2 id="detalle-precio" class="text-success mb-4 fw-bold"></h2>

          <p id="detalle-desc" class="descrip-detalle mb-4 lead"></p>

          <div class="card border-0 bg-light p-3 mb-4 rounded-3">
            <div class="row g-3 small">
              <div class="col-6">
                <strong class="descripciondetalle"
                  ><i class="bi bi-layers text-primary"></i> Material:</strong
                >
                <br />
                <span id="detalle-fabric"></span>
              </div>
              <div class="col-6">
                <strong class="descripciondetalle"
                  ><i class="bi bi-geo-alt text-danger"></i> Región:</strong
                >
                <br />
                <span id="detalle-region"></span>
              </div>
              <div class="col-12 border-top pt-2 mt-2">
                <strong class="descripciondetalle"
                  ><i class="bi bi-droplet text-info"></i> Cuidado:</strong
                >
                <br />
                <span id="detalle-care"></span>
              </div>
            </div>
          </div>

          <div id="detalle-seccion-tallas" class="mb-4 d-none">
            <label class="fw-bold mb-2">Selecciona tu talla:</label>
            <select
              id="detalle-select-tallas"
              class="form-select w-50"
            ></select>
          </div>

          <button
            id="btn-detalle-carrito"
            class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm"
            style="background-color: var(--primary-color)"
          >
            <i class="bi bi-cart-plus me-2"></i> Añadir al Carrito
          </button>
        </div>
      </div>

      <div id="mensaje-error" class="text-center py-5 d-none">
        <h2 class="fw-bold text-danger mb-3">Producto no encontrado</h2>
        <p>Parece que este producto ya no existe o el enlace es incorrecto.</p>
        <a href="index.html" class="btn btn-outline-dark mt-3"
          >Volver a la tienda</a
        >
      </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./javascript/main.js"></script>
    <script src="./javascript/productos.js"></script>
    <script src="./javascript/fetch.js"></script>
  </body>
</html>
