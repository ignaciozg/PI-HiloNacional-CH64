<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hilo Nacional | Catálogo</title>
  <script>
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./CSS/main.css">
  <link rel="stylesheet" href="css/productos.css">
</head>

<body class="theme-ready">
  <div id="navbar-container"></div>



  <div class="container mb-5">
    <div class="category-banner shadow-sm" style="background: background-size: cover; border-radius: 15px; height: 180px;  align-content:center;">
        <div class="px-5 text-white">
            <h2>Nuestro Catálogo</h2>
            <p>Explora todos nuestros productos que conservan la tradición en cada fibra</p>
        </div>
    </div>
  </div>

    <div class="container mt-5 mb-4">
    <div class="row align-items-center">
      <div class="col-auto"><h5 class="mb-0 fw-bold">Categorías:</h5></div>
      <div class="col">
        <div class="d-flex gap-2 flex-wrap">
          <button class="filter-btn active">Todos</button>
          <button class="filter-btn">Mujer</button>
          <button class="filter-btn">Hombre</button>
          <button class="filter-btn">Accesorios</button>
          <button class="filter-btn">Calzado</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container mb-5">
    <div class="row g-4" id="contenedor-productos"></div>
  </div>

  <div class="offcanvas offcanvas-end card" tabindex="-1" id="offcanvasFavoritos">
    <div class="offcanvas-header border-bottom border-secondary">
      <h5 class="fw-bold mb-0">Mis Favoritos</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body" id="lista-favoritos"></div>
  </div>

  <div class="offcanvas offcanvas-end card" tabindex="-1" id="offcanvasCarrito">
    <div class="offcanvas-header border-bottom border-secondary">
      <h5 class="fw-bold mb-0">Mi Carrito</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="lista-carrito" class="flex-grow-1"></div>
      <div class="p-3 border-top border-secondary">
        <div class="d-flex justify-content-between mb-2">
          <span>Total:</span> <span id="total-carrito" class="fw-bold" style="color: var(--primary-color);">$0.00</span>
        </div>
        <button class="btn w-100 rounded-pill py-2 text-white" style="background-color: var(--primary-color);">Pagar</button>
      </div>
    </div>
  </div>

  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content card border-0 shadow-lg">
        <div class="modal-header border-0 pb-0">
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-4">
            <div class="col-md-6 text-center">
              <img id="productModalImg" src="" class="img-fluid rounded shadow-sm">
            </div>
            <div class="col-md-6">
              <h4 id="productModalLabel" class="fw-bold mb-3"></h4>
              <p id="productModalDesc" class="small"></p>
              <div class="small border-top pt-3 border-secondary">
                <p class="mb-1"><strong>Material:</strong> <span id="productFabric"></span></p>
                <p class="mb-1"><strong>Región:</strong> <span id="productRegion"></span></p>
                <p class="mb-1"><strong>Cuidado:</strong> <span id="productCare"></span></p>
              </div>
              <div id="sizeSection" class="my-3 d-none">
                <label class="fw-bold small d-block mb-1">Talla:</label>
                <select id="productSize" class="form-select form-select-sm buscar"></select>
              </div>
              <h3 id="productModalPrice" class="fw-bold mt-4" style="color: var(--primary-color);"></h3>
              <button id="btn-modal-carrito" class="btn w-100 rounded-pill mt-3 py-2 text-white" style="background-color: var(--primary-color);">Añadir al Carrito</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./javascript/productos.js"></script>
  
  <script>
    // Inyección de componentes (Navbar y Footer)
    Promise.all([
      fetch('./componentes/navbar.html').then(res => res.text()),
      fetch('./componentes/footer.html').then(res => res.text()) // Asegúrate de tener este archivo creado
    ]).then(([navbarHtml, footerHtml]) => {
        document.getElementById('navbar-container').innerHTML = navbarHtml;
        document.getElementById('footer-container').innerHTML = footerHtml;
        
        if(typeof inicializarUI === 'function') inicializarUI();
        if(typeof setupTheme === 'function') setupTheme();
        if(typeof setupSearch === 'function') setupSearch();
    }).catch(err => console.error("Error cargando componentes:", err));
  </script>
</body>
</html>
